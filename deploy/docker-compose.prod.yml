# Paridad prod local: MISMA imagen que Render (deploy/Dockerfile.render) +
# MISMO entrypoint (migrate + seed + nginx + API en un contenedor).
# Uso: make prod-local  →  http://localhost/  (Nginx :80 → SPA + /api → :3001)
# Con el puerto 80 ocupado: PROD_PORT=8088 make prod-local → http://localhost:8088/
name: grupo10-local
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pis_dev}
      POSTGRES_DB: ${POSTGRES_DB:-pis_titulacion}
    volumes:
      - ${DOCKER_VOLUMES_PATH:-../../docker-volumes/grupo10-proyecto}/postgres-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pis} -d $${POSTGRES_DB:-pis_titulacion}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.render
    restart: unless-stopped
    ports:
      - "${PROD_PORT:-80}:80"
    environment:
      PORT: 80
      DATABASE_URL: postgres://${POSTGRES_USER:-pis}:${POSTGRES_PASSWORD:-pis_dev}@postgres:5432/${POSTGRES_DB:-pis_titulacion}
      DOCS_VOLUME_PATH: /var/data/titulacion-docs
      # Modo entrega: stream evita problemas de permisos de sistema de archivos con Nginx X-Accel
      DOCS_ENTREGA: ${DOCS_ENTREGA:-stream}
      # Auth real en modo prod-local (mismos nombres que en Render):
      JWT_SECRET: ${JWT_SECRET:-prod-local-secret-solo-para-paridad-no-usar-en-render-123456}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-x}
      AUTH_STUB: "0"
      NODE_ENV: production
      SEED_MODE: ${SEED_MODE:-demo}
      # Análisis documental: habilitado por defecto; admite direct o docker-queue.
      ANALISIS_DOCUMENTAL_ENABLED: ${ANALISIS_DOCUMENTAL_ENABLED:-1}
      PDF_EXTRACTOR_MODE: ${PDF_EXTRACTOR_MODE:-direct}
      PDF_SANDBOX_QUEUE: /var/data/pdf-sandbox-queue
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_REVISION_ENABLED: ${GEMINI_REVISION_ENABLED:-0}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Enlaces de los correos
      APP_URL: ${PROD_APP_URL:-http://localhost:${PROD_PORT:-80}}
      # Correo: sin SMTP_HOST solo se registra en el log. Para verlos en el
      # Mailpit de `make dev`: SMTP_HOST=host.docker.internal SMTP_PORT=1025
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@fips.unsa.edu.pe}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${DOCKER_VOLUMES_PATH:-../../docker-volumes/grupo10-proyecto}/documentos:/var/data/titulacion-docs
      - ${DOCKER_VOLUMES_PATH:-../../docker-volumes/grupo10-proyecto}/sandbox/queue:/var/data/pdf-sandbox-queue
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  # Respaldo diario (RNF-03): docker compose -f deploy/docker-compose.prod.yml
  # --profile backup up -d. Respaldos en docker-volumes/grupo10-proyecto/backups/ (ver
  # docs/04-operations/backup-restore.md); make backup / make restore.
  backup:
    image: postgres:16-alpine
    # Este servicio solo usa pg_dump: no necesita el volumen implícito de PostgreSQL.
    tmpfs:
      - /var/lib/postgresql/data
    profiles: ["backup"]
    restart: unless-stopped
    command: ["/bin/sh", "/opt/backup/programar.sh"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pis}:${POSTGRES_PASSWORD:-pis_dev}@postgres:5432/${POSTGRES_DB:-pis_titulacion}
      DOCS_DIR: /docs
      BACKUP_DIR: /backups
      BACKUP_RETENCION_DIAS: ${BACKUP_RETENCION_DIAS:-30}
      BACKUP_CRON: ${BACKUP_CRON:-0 7 * * *}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${DOCKER_VOLUMES_PATH:-../../docker-volumes/grupo10-proyecto}/documentos:/docs
      - ${DOCKER_VOLUMES_PATH:-../../docker-volumes/grupo10-proyecto}/backups:/backups
      - ./backup:/opt/backup:ro
